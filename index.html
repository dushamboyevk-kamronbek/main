
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comfort - Furniture Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <div class="announcement">
    <p>✓ Free Shipping On All Orders Over $50</p>
  </div>

  <header class="header">
    <div class="logo">
      <img src="./img/Logo.png" alt="Comfort Logo">
    </div>

    <div class="search">
      <input type="text" placeholder="Search here...">
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="header-icons">
      <button><i class="fa-solid fa-cart-shopping"></i> Cart</button>
      <button><i class="fa-regular fa-heart"></i></button>
      <button><i class="fa-regular fa-user"></i></button>
    </div>
  </header>

  <nav class="navbar">
    <button class="categories">
      <i class="fa-solid fa-bars"></i> All Categories
    </button>

    <div class="menu">
      <a href="#" class="active">Home</a>
      <a href="#">Shop</a>
      <a href="#">Product</a>
      <a href="#">Pages</a>
      <a href="#">About</a>
    </div>

    <p>Contact: (808) 555-0111</p>
  </nav>

  <section class="hero">
    <div class="hero-inner">

      <div class="hero-text">
        <p class="welcome">WELCOME TO CHAIRY</p>

        <h1>
          Best Furniture<br>
          Collection for your<br>
          interior.
        </h1>

        <button class="shop-btn">
          Shop Now
          <i class="fa-solid fa-arrow-right-long"></i>
        </button>
      </div>

      <img src="./img/BG Shapes.png" alt="" class="hero-bg">

      <img src="./img/Product Image.png" alt="Furniture Chair" class="hero-product">

      <img src="./img/Slider.png "  alt="" class=" ">

    </div>
  </section>

</body>
</html>
